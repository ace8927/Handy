name: Windows Remote STT EXE

on:
  workflow_dispatch:

# The nested build job in build.yml declares `contents: write`; the caller
# must grant it explicitly (fork default token scope is read-only).
permissions:
  contents: write

jobs:
  build-windows:
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: ""
      sign-binaries: false
      upload-artifacts: true
      asset-prefix: handy-remote-stt
